# Push to `staging` -> tests (licence server and hub against a real Postgres:
# tests/) -> build the admin hub and license server images -> push to ECR ->
# roll them on the fleet control host via AWS SSM (licenses migration 001 runs
# first; it is additive).
#
# A push to a `ci/...` branch runs the tests only: nothing is deployed.
#
# AWS access is GitHub OIDC -> role chakra-fleet-github-deploy.
name: deploy

on:
  push:
    branches: [staging, "ci/**"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-control-host-admin
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  AWS_ROLE_ARN: arn:aws:iam::365642144025:role/chakra-fleet-github-deploy
  REGISTRY: 365642144025.dkr.ecr.eu-north-1.amazonaws.com
  INSTANCE_ID: i-0a3746e73b44aafc5

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: console
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Licence server
        working-directory: chakra-license-server
        run: |
          pip install -q -r requirements.txt
          python ../tests/license_server_e2e.py
      - name: Hub (lint, types, build, HTTP checks)
        run: bash tests/hub_e2e.sh

  deploy:
    needs: test
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and push the images
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          for app in chakra-license-hub chakra-license-server; do
            docker build -t "$REGISTRY/$app:$GITHUB_SHA" -t "$REGISTRY/$app:staging" "$app"
            docker push "$REGISTRY/$app:$GITHUB_SHA"
            docker push "$REGISTRY/$app:staging"
          done

      - name: Roll the control host
        run: |
          CMD="sudo -u ubuntu -H bash /opt/chakra/chakra-gpu-fleet/deploy/deploy.sh admin $GITHUB_SHA"
          ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
                 --comment "chakra-ivr-console ${GITHUB_SHA::7}" --timeout-seconds 600 \
                 --parameters "$(jq -nc --arg c "$CMD" '{commands: [$c]}')" \
                 --query Command.CommandId --output text)
          echo "SSM command $ID"
          aws ssm wait command-executed --command-id "$ID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE_ID" \
            --query '[Status, StandardOutputContent, StandardErrorContent]' --output text
          test "$(aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE_ID" --query Status --output text)" = Success

      - name: Check the admin hub answers
        run: |
          for i in $(seq 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://admin.13-53-80-177.sslip.io/login)
            [ "$code" = 200 ] && exit 0
            sleep 5
          done
          exit 1
